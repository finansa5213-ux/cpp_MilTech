# Бортовий маршрутизатор каналів керування БПЛА.
# Значення - результати вимірювань на стенді 17-18.09.2026.
# Файл читається один раз на старті: після правки потрібен systemctl restart uav-link.

# --- пристрої --------------------------------------------------------------
fc_device    = /dev/ttyAMA0
fc_baud      = 921600
radio_device = /dev/uav_radio          # правило udev на модем SiK
radio_baud   = 57600                   # S1 SERIAL_SPEED = 57

# --- мережа ----------------------------------------------------------------
udp_port      = 14550
peer_host     = 10.8.0.1               # концентратор; пряма схема = 10.8.0.3
peer_port     = 14550
echo_port     = 14555                  # відбивач RTT на сервері
operator_host = 10.8.0.3               # для вимірювання повного шляху
control_port  = 14552
control_allow = 127.0.0.1, 10.8.0.3    # спостерігач 10.8.0.4 каналами не керує

# Приймати висхідний трафік лише від концентратора. Другий, незалежний рубіж
# розмежування прав: 18.09 виявлено, що станція-спостерігач мала пряму лінію
# на борт в обхід сервера, і фільтр лише на концентраторі обходився
# налаштуванням клієнта.
peer_fixed = 1

# --- часи й пороги ---------------------------------------------------------
# Три пропущені HEARTBEAT наземної станції (вона шле 1 Гц).
# Виміряний час виявлення втрати: 2,85 +- 0,14 с на чотирьох повторах.
t_lost_sec = 3.0

# Витримка перед поверненням на основний канал. Виміряний час повернення:
# 10,75 +- 0,06 с (10 с витримки + 0,75 с на відновлення трафіку).
t_back_sec = 10.0

# Точка рівноваги - медіана повного обігу каналу A, 160,9 мс. Керувати рівно
# на ній не можна: повний шлях каналу B за ніч гуляв 126,8...197,8 мс і
# перетинав її сам собою. Пороги рознесені в гістерезисну смугу 30 мс -
# удвічі ширшу за дрижання вимірювання (mdev 6...17 мс).
rtt_switch_full_ms = 200.0
rtt_back_full_ms   = 170.0

# Запасна оцінка наземної ділянки сервер <-> оператор, якщо ICMP до оператора
# не відповідає. Виміряно 72,0 і 65,2 мс у двох прогонах з різницею 10 хвилин -
# звідси й рішення міряти повний шлях, а не додавати константу.
rtt_offset_ms = 68.0

# Виміри, старші за це, недійсні: канал, що лежить, не повинен звітувати
# про 63 мс лише тому, що така була остання відповідь.
rtt_stale_sec = 5.0

# --- захист від втрати зв'язку ---------------------------------------------
failsafe_sec    = 5.0
failsafe_action = log      # log = лише запис у журнал; rtl = справді командувати повернення

# Не командувати повернення, поки оцінювач польотного контролера не має
# дійсної абсолютної горизонтальної координати (ESTIMATOR_STATUS, msgid 230,
# біт POS_HORIZ_ABS = 16).
#
# Підстава - вимірювання 20.09.2026. Під час підміни GNSS приймач заявляв
# 28 супутників, eph 0,58 м і швидкість 55,97 м/с у нерухомого апарата, а
# оцінювач цю підміну відбив: gps_check_fail_flags = 320 (дрейф координати
# й дрейф швидкості), solution_status_flags = 1189, ref_lat = nan,
# xy_global = False. У такому стані команда повернення не ризикована -
# вона нездійсненна, бо немає звідки відлічувати шлях додому.
require_nav_for_rtl = 1

# Стан оцінювача, старший за це, недійсний.
#
# Значення виміряне, а не вибране. `mavlink status streams` на стенді
# 20.09.2026 показав для нашого каналу (примірник #0, режим Normal):
#
#     ESTIMATOR_STATUS   0.50 (0.298) Гц   54 Б
#
# У дужках - фактична частота. PX4 масштабує ВСІ потоки під MAV_1_RATE:
# коефіцієнт 0,596 однаковий для всього переліку (ATTITUDE 15,00 -> 8,946,
# GLOBAL_POSITION_INT 5,00 -> 2,982). Отже фактичний період - 3,36 с.
#
# Строк придатності має покривати щонайменше три періоди: 3 x 3,36 = 10,1 с,
# округлено до 12. Початкові 5 с покривали півтора періоду, і одного
# пропущеного повідомлення вистачило б для хибного висновку про втрату
# навігації.
#
# Якщо підняти потік до 2 Гц (ціна +48 Б/с, 1,9 % каналу):
#     mavlink stream -d <пристрій> -s ESTIMATOR_STATUS -r 2
# фактична частота стає 1,19 Гц, період 0,84 с, і 5 с покривають шість
# періодів. Тоді це значення можна повернути до 5,0.
nav_stale_sec = 12.0

# --- потоки даних ----------------------------------------------------------
# Накопичення телеметрії перед відправленням. Без нього міст видавав ~2600
# датаграм за секунду по 9 байтів, і накладні витрати тунелю сягали 12x.
flush_sec    = 0.02
max_datagram = 1024

# Усе, що не пішло, поки канал лежав, - застаріле. Віддати через три секунди
# старий крен гірше, ніж не віддати нічого.
max_backlog = 4096

# HEARTBEAT у резервний канал: 21 Б/с. Без нього наземна станція згортає
# невживану лінію, борт перестає бачити резерв живим і не має куди повертатися.
# Для каналу A це ще й єдиний спосіб мати свіжі rssi/шум ДО перемикання.
keepalive_sec = 1.0

probe_sec      = 1.0     # зонд у тунелі (борт <-> сервер)
full_probe_sec = 5.0     # ICMP до оператора (повний шлях)
report_sec     = 30.0
